
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        
        .custom-radio input:checked + label {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }
        .custom-checkbox input:checked + label {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }
        .animate-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-600 mb-2">Join Our Team</h1>
            <p class="text-gray-600">We're excited you're considering a career with us. Please fill out this form to apply.</p>
            <div class="mt-4 flex justify-center">
                <div class="w-24 h-1 bg-blue-500 rounded-full"></div>
            </div>
        </div>
        <!-- Form Container -->
        <form class="bg-white shadow-lg rounded-lg overflow-hidden p-6 md:p-8">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <!-- First Name -->
                    <div>
                        <label for="firstName" class="block text-sm font-medium text-gray-700 mb-1">First Name <span class="text-red-500">*</span></label>
                        <div class="relative">
                            <input type="text" id="firstName" name="firstName" required
                                class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500"
                                placeholder="John">
                            <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-red-500 hidden" id="firstNameError">
                                <i class="fas fa-exclamation-circle"></i>
                            </div>
                        </div>
                        <p class="mt-1 text-xs text-red-600 hidden" id="firstNameErrorMessage">First name is required</p>
                    </div>
                    
                    <!-- Last Name -->
                    <div>
                        <label for="lastName" class="block text-sm font-medium text-gray-700 mb-1">Last Name <span class="text-red-500">*</span></label>
                        <div class="relative">
                            <input type="text" id="lastName" name="lastName" required
                                class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500"
                                placeholder="Doe">
                            <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-red-500 hidden" id="lastNameError">
                                <i class="fas fa-exclamation-circle"></i>
                            </div>
                        </div>
                        <p class="mt-1 text-xs text-red-600 hidden" id="lastNameErrorMessage">Last name is required</p>
                    </div>
                    
                    <!-- Email -->
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email <span class="text-red-500">*</span></label>
                        <div class="relative">
                            <input type="email" id="email" name="email" required
                                class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500"
                                placeholder="john.doe@example.com">
                            <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-red-500 hidden" id="emailError">
                                <i class="fas fa-exclamation-circle"></i>
                            </div>
                        </div>
                        <p class="mt-1 text-xs text-red-600 hidden" id="emailErrorMessage">Please enter a valid email</p>
                    </div>
                    
                    <!-- Phone -->
                    <div>
                        <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
                        <div class="relative">
                            <input type="tel" id="phone" name="phone"
                                class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500"
                                placeholder="(123) 456-7890">
                        </div>
                    </div>
                </div>
            
                <div class="mb-6">
                  <label for="gender" class="block text-sm font-medium text-gray-700 mb-1">Gender <span class="text-red-500">*</span></label>
                  <select id="gender" name="gender"
                      class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                      <option value="">Select a gender</option>
                      <option value="male">Male</option>
                      <option value="female">Female</option>
                  </select>
                </div>
                
                <!-- Position Applying For -->
                <div class="mb-6">
                    <label for="position" class="block text-sm font-medium text-gray-700 mb-1">Position Applying For <span class="text-red-500">*</span></label>
                    <select id="position" name="position" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                        <option value="">Select a position</option>
                        <option value="frontend">Frontend Developer</option>
                        <option value="backend">Backend Developer</option>
                        <option value="fullstack">Full Stack Developer</option>
                        <option value="designer">UI/UX Designer</option>
                        <option value="pm">Product Manager</option>
                        <option value="marketing">Marketing Specialist</option>
                    </select>
                </div>
                

                <!-- Years of Experience -->
                <div class="mb-6">
                    <label for="experience" class="block text-sm font-medium text-gray-700 mb-1">Years of Relevant Experience</label>
                    <select id="experience" name="experience"
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                        <option value="">Select years</option>
                        <option value="0-1">0-1 years</option>
                        <option value="1-3">1-3 years</option>
                        <option value="3-5">3-5 years</option>
                        <option value="5-10">5-10 years</option>
                        <option value="10+">10+ years</option>
                    </select>
                </div>
                
                
                <!-- Availability -->
                <div class="mb-6">
                    <label for="availability" class="block text-sm font-medium text-gray-700 mb-1">When can you start?</label>
                    <div class="relative">
                        <input type="date" id="availability" name="availability"
                            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                    </div>
                </div>
                
                <!-- Work Authorization -->
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Are you legally authorized to work in the country you're applying for? <span class="text-red-500">*</span></label>
                    <div class="flex space-x-4">
                        <div class="flex items-center">
                            <input type="radio" id="authYes" name="workAuthorization" value="yes" class="h-4 w-4 text-blue-600 focus:ring-blue-500" required>
                            <label for="authYes" class="ml-2 block text-sm text-gray-700">Yes</label>
                        </div>
                        <div class="flex items-center">
                            <input type="radio" id="authNo" name="workAuthorization" value="no" class="h-4 w-4 text-blue-600 focus:ring-blue-500">
                            <label for="authNo" class="ml-2 block text-sm text-gray-700">No</label>
                        </div>
                    </div>
                </div>
                
                <!-- Willing to Relocate -->
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Are you willing to relocate?</label>
                    <div class="flex items-center">
                        <input type="checkbox" id="relocate" name="relocate" class="h-4 w-4 text-blue-600 focus:ring-blue-500 rounded">
                        <label for="relocate" class="ml-2 block text-sm text-gray-700">Yes, I'm open to relocation</label>
                    </div>
                </div>
            
                
                <!-- Cover Letter -->
                <div class="mb-6">
                    <label for="coverLetter" class="block text-sm font-medium text-gray-700 mb-1">Cover Letter</label>
                    <textarea id="coverLetter" name="coverLetter" rows="4"
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500"
                        placeholder="Tell us why you're a great fit for this position..."></textarea>
                </div>
                
                <!-- Salary Expectations -->
                <div class="mb-6">
                    <label for="salary" class="block text-sm font-medium text-gray-700 mb-1">Salary Expectations (USD)</label>
                    <div class="flex items-center gap-4">
                        <input type="range" id="salary" name="salary" min="30000" max="200000" step="5000" value="75000"
                            class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                        <span id="salaryValue" class="text-sm font-medium text-gray-700">$75,000</span>
                    </div>
                    <div class="flex justify-between text-xs text-gray-500 mt-1">
                        <span>$30k</span>
                        <span>$200k</span>
                    </div>
                </div>
           

                
                

            <!-- How did you hear about us? -->
            <div class="mb-6">
                <label for="referral" class="block text-sm font-medium text-gray-700 mb-1">How did you hear about us?</label>
                <select id="referral" name="referral"
                    class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                    <option value="">Select an option</option>
                    <option value="linkedin">LinkedIn</option>
                    <option value="job-board">Job Board</option>
                    <option value="referral">Employee Referral</option>
                    <option value="event">Career Fair/Event</option>
                    <option value="social">Social Media</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <!-- Terms and Conditions -->
            <div class="mb-8">
                <div class="flex items-start">
                    <div class="flex items-center h-5">
                        <input id="terms" name="terms" type="checkbox" required class="focus:ring-blue-500 h-4 w-4 text-blue-600 border-gray-300 rounded">
                    </div>
                    <div class="ml-3 text-sm">
                        <label for="terms" class="font-medium text-gray-700">I agree to the <a href="#" class="text-blue-600 hover:text-blue-500">Terms and Conditions</a> and <a href="#" class="text-blue-600 hover:text-blue-500">Privacy Policy</a> <span class="text-red-500">*</span></label>
                        <p class="text-gray-500">By submitting this application, you consent to our processing of your personal data.</p>
                    </div>
                </div>
            </div>
            
            <!-- Form Actions -->
            <div class="flex flex-col sm:flex-row justify-between gap-4">
                <button type="button" class="px-6 py-3 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    Save as Draft
                </button>
                <div class="flex flex-col sm:flex-row gap-4">
                    <button type="reset" class="px-6 py-3 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                        Reset Form
                    </button>
                    <button type="submit" class="px-6 py-3 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 shadow-lg transition-all duration-200 transform hover:scale-105">
                        Submit Application
                        <i class="fas fa-paper-plane ml-2"></i>
                    </button>
                </div>
            </div>
        </form>
        
    </div>
</body>
</html>
